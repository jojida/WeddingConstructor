<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эталон — место проведения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/studio-blocks.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="invite">
    <!-- 1 — МЕСТО ПРОВЕДЕНИЯ -->
    <section class="panel">
      <div class="canvas s-mesto-provedeniya">
        <h2 class="mesto-provedeniya__zagolovok" data-edit="venueTitle">Место проведения</h2>
        <img class="mesto-provedeniya__osobnyak" data-edit="venuePhoto" src="assets/mansion.webp" alt="Место проведения" />
        <p class="mesto-provedeniya__nazvanie-mesta" data-edit="venue">ваа</p>
        <p class="mesto-provedeniya__tekst">Новый текст</p>
      </div>
    </section>

    <!-- 2 — СЕКЦИЯ 2 -->
    <section class="panel">
      <div class="canvas s-sekciya-2">
        <div class="sekciya-2__programma-dnya" data-block="schedule" data-params="{&quot;size&quot;:19,&quot;accent&quot;:&quot;#7c6a54&quot;}"></div>
        <p class="sekciya-2__tekst">кукук</p>
      </div>
    </section>

    <!-- 3 — СЕКЦИЯ 3 -->
    <section class="panel">
      <div class="canvas s-sekciya-3">
        <p class="sekciya-3__tekst">Новый текст</p>
        <img class="sekciya-3__photo-2024-06-23-22-28-36" src="assets/photo-2024-06-23-22-28-36-210eaa.webp" alt="" />
      </div>
    </section>
  </main>

  <script src="../assets/music.js"></script>
  <script src="../assets/photo-frame.js"></script>
  <script src="../assets/venue-map.js"></script>
  <script src="../assets/studio-runtime.js"></script>
  <script src="script.js"></script>
</body>
</html>
