<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.style.cssText = `
                    position: absolute;
                    width: 0;
                    height: 0;
                    background: rgba(0,0,0,0.05);
                    border-radius: 50%;
                    transform: translate(-50%, -50%);
                    left: ${x}px;
                    top: ${y}px;
                    transition: width 0.4s ease-out, height 0.4s ease-out, opacity 0.4s ease-out;
                `;
                btn.style.position = 'relative';
                btn.style.overflow = 'hidden';
                btn.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.style.width = '300px';
                    ripple.style.height = '300px';
                    ripple.style.opacity = '0';
                }, 0);
                
                setTimeout(() => ripple.remove(), 400);
            });
        });

        // Simple parallax effect for phone mockup
        const canvas = document.querySelector('main');
        const frame = document.querySelector('.group');
        canvas.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            frame.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        
        canvas.addEventListener('mouseleave', () => {
            frame.style.transform = `rotateY(0deg) rotateX(0deg)`;
            frame.style.transition = 'all 0.5s ease';
        });

        canvas.addEventListener('mouseenter', () => {
            frame.style.transition = 'none';
        });
    </script>
